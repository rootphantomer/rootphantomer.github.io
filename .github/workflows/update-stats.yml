name: Update site stats

# 手动刷新 data/stats.json —— 页面在 GitHub API 不可用时会退回这份快照。
#
# 不再定时执行：页面现在直接调用 GitHub API 拿实时数据，
# 本工作流只是备用手段，需要时在 Actions 页面点 "Run workflow" 即可。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: rootphantomer
        run: node scripts/update-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/stats.json; then
            echo "数据无变化，跳过提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "chore: update site stats"
          git push
